name: image
on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.sh"
      - requirements.txt
      - web/**
      - deploy/scheduler.sh
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 for a Pi or a Synology; the museums and the TV don't care.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/no1089/frame-art:latest
            ghcr.io/no1089/frame-art:${{ github.sha }}
