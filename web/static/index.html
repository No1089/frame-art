<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
  :root { --fg:#e6e2d9; --dim:#8d877c; --faint:#6f6a61; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#000; overflow:hidden;
    font-family:Georgia,"Times New Roman",serif; color:var(--fg); }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage img { max-width:100%; max-height:100%; object-fit:contain; opacity:0;
    transition:opacity .7s ease; user-select:none; -webkit-user-drag:none; }
  #stage img.on { opacity:1; }

  #caption { position:fixed; left:0; right:0; bottom:0; padding:
    28px max(28px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));
    background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.72) 55%,transparent 100%);
    transition:opacity .4s ease; pointer-events:none; }
  #caption.hide { opacity:0; }
  #artist { font-size:clamp(19px,2.6vw,30px); letter-spacing:.01em; }
  #title { font-size:clamp(16px,2.1vw,24px); font-style:italic; color:var(--dim); margin-top:3px; }
  #tomb { font-size:clamp(12px,1.4vw,15px); color:var(--faint); margin-top:12px; }
  #blurb { font-size:clamp(13px,1.5vw,16px); color:var(--dim); margin-top:12px;
    max-width:70ch; line-height:1.5; }
  @media (max-width:820px){ #blurb{ display:none; } }

  #bar { position:fixed; top:0; left:0; height:2px; background:var(--dim); width:0; opacity:.5; }
  #count { position:fixed; top:max(14px,env(safe-area-inset-top)); right:max(16px,env(safe-area-inset-right));
    font-size:12px; color:var(--faint); transition:opacity .4s ease; }
  #count.hide { opacity:0; }
  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:15px; }

  /* Sends the piece to the Frame on the wall. Deliberate press only: the TV
     does its own unattended rotation. */
  #tv { position:fixed; top:max(12px,env(safe-area-inset-top)); left:max(16px,env(safe-area-inset-left));
    font:inherit; font-size:13px; color:var(--faint); background:rgba(0,0,0,.35);
    border:1px solid rgba(230,226,217,.18); border-radius:999px; padding:7px 15px;
    cursor:pointer; transition:opacity .4s ease,color .2s ease; }
  #tv:hover { color:var(--fg); }
  #tv:disabled { opacity:.45; cursor:default; }
  #tv.hide { opacity:0; }

  #src { position:fixed; bottom:max(12px,env(safe-area-inset-bottom));
    right:max(16px,env(safe-area-inset-right)); font-size:11px; color:var(--faint);
    text-decoration:none; opacity:.55; transition:opacity .4s ease; z-index:2; }
  #src:hover { opacity:1; }
  #src.hide { opacity:0; }
</style>
</head>
<body>
<div id="stage"><img id="a" alt=""><img id="b" alt="" style="display:none"></div>
<div id="bar"></div>
<div id="count"></div>
<button id="tv" type="button">send to the Frame</button>
<!-- AGPL section 13: anyone served this page is entitled to the source of
     the version serving it. If you fork this, repoint the link. -->
<a id="src" href="https://github.com/No1089/frame-art"
   target="_blank" rel="noopener noreferrer">source</a>
<div id="caption" class="hide">
  <div id="artist"></div>
  <div id="title"></div>
  <div id="tomb"></div>
  <div id="blurb"></div>
</div>
<div id="msg">loading the collection…</div>

<script>
const HOLD_MS = 25000;          // how long each work stays up
let works = [], order = [], at = 0, timer = null, paused = false;
const stage = document.getElementById('stage');
const cap = document.getElementById('caption');
const countEl = document.getElementById('count');
const bar = document.getElementById('bar');
let front = document.getElementById('a'), back = document.getElementById('b');

const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

function setCaption(w){
  document.getElementById('artist').textContent = w.artist || '';
  document.getElementById('title').textContent = w.date ? `${w.title}, ${w.date}` : w.title;
  const tomb = [w.medium, w.credit].filter(Boolean).join(', ');
  const line = tomb ? tomb.charAt(0).toUpperCase()+tomb.slice(1) : '';
  // The museum is an attribution, not decoration: AIC curatorial text is CC-BY.
  document.getElementById('tomb').textContent = [line, w.museum].filter(Boolean).join(' · ');
  document.getElementById('blurb').textContent = w.blurb || '';
  countEl.textContent = `${at+1} / ${order.length}`;
}

function preload(i){
  if (!order.length) return;
  const w = works[order[i % order.length]];
  const im = new Image(); im.src = `/img/${encodeURIComponent(w.id)}`;
}

function show(i){
  at = (i + order.length) % order.length;
  const w = works[order[at]];
  back.onload = () => {
    front.classList.remove('on');
    back.style.display = ''; back.classList.add('on');
    const t = front; front = back; back = t;
    back.style.display = 'none';
    setCaption(w);
    cap.classList.remove('hide'); countEl.classList.remove('hide');
    tvBtn.classList.remove('hide'); srcEl.classList.remove('hide');
    clearTimeout(window._capHide);
    window._capHide = setTimeout(() => {
      cap.classList.add('hide'); countEl.classList.add('hide');
      tvBtn.classList.add('hide'); srcEl.classList.add('hide');
    }, 8000);
    preload(at+1);
  };
  back.onerror = () => next();
  back.src = `/img/${encodeURIComponent(w.id)}`;
  restartTimer();
}

function restartTimer(){
  clearInterval(timer); bar.style.transition='none'; bar.style.width='0';
  if (paused) return;
  requestAnimationFrame(()=>{ bar.style.transition=`width ${HOLD_MS}ms linear`; bar.style.width='100%'; });
  timer = setTimeout(next, HOLD_MS);
}
const next = () => show(at+1);
const prev = () => show(at-1);

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); next(); }
  else if (e.key==='ArrowLeft') prev();
  else if (e.key.toLowerCase()==='p') { paused=!paused; restartTimer(); }
});

let x0=null, y0=null;
stage.addEventListener('touchstart', e => { x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', e => {
  if (x0===null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
  else { [cap, countEl, tvBtn, srcEl].forEach(el => el.classList.toggle('hide')); }
  x0 = y0 = null;
}, {passive:true});
stage.addEventListener('click', () => {
  [cap, countEl, tvBtn, srcEl].forEach(el => el.classList.toggle('hide'));
});

const tvBtn = document.getElementById('tv');
const srcEl = document.getElementById('src');
tvBtn.addEventListener('click', async e => {
  e.stopPropagation();
  tvBtn.disabled = true;
  const revert = t => setTimeout(() => { tvBtn.textContent = 'send to the Frame'; tvBtn.disabled = false; }, t);
  tvBtn.textContent = 'sending…';
  try {
    const r = await fetch('/api/next', {method: 'POST'});
    const d = await r.json();
    tvBtn.textContent = d.ok ? `${d.artist} — on the wall` : (d.error || 'failed');
  } catch (_) {
    tvBtn.textContent = 'could not reach the Frame';
  }
  revert(4000);
});

fetch('/api/works').then(r => r.json()).then(data => {
  works = data;
  if (!works.length) { document.getElementById('msg').textContent = 'no works in the library yet'; return; }
  order = shuffle([...works.keys()]);
  document.getElementById('msg').remove();
  show(0);
}).catch(() => { document.getElementById('msg').textContent = 'could not load the collection'; });
</script>
</body>
</html>
